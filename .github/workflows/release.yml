# Builds Save Garage for Windows, macOS (Apple silicon and Intel) and Linux, attaches the zips to the release,
# and publishes SHA256 checksums. Runs when a release is published, or by hand for an existing tag.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach to (for example v1.0.0)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pyinstaller
      - run: scripts\build_windows.bat
        shell: cmd
      - name: Smoke test
        shell: pwsh
        run: |
          $p = Start-Process build_out\dist\SaveGarage\SaveGarage.exe -ArgumentList '--no-browser','--port','7399' -PassThru
          Start-Sleep -Seconds 8
          $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:7399/api/state
          if ($r.Content -notmatch '"version"') { throw 'no state' }
          Stop-Process -Id $p.Id -Force
      - run: Compress-Archive -Path build_out\dist\SaveGarage -DestinationPath SaveGarage-windows.zip
      - run: gh release upload $env:TAG SaveGarage-windows.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: apple-silicon
          - runner: macos-15-intel
            arch: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: ./scripts/build_macos.sh
      - name: Smoke test
        run: |
          build_out/dist/SaveGarage.app/Contents/MacOS/SaveGarage --no-browser --port 7399 &
          sleep 8
          curl -sf http://127.0.0.1:7399/api/state | grep -q '"version"'
          kill %1
      - run: mv build_out/dist/SaveGarage-macos.zip SaveGarage-macos-${{ matrix.arch }}.zip
      - run: gh release upload "$TAG" SaveGarage-macos-${{ matrix.arch }}.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: ./scripts/build_linux.sh
      - name: Smoke test
        run: |
          build_out/dist/SaveGarage/SaveGarage --no-browser --port 7399 &
          sleep 8
          curl -sf http://127.0.0.1:7399/api/state | grep -q '"version"'
          kill %1
      - run: gh release upload "$TAG" build_out/dist/SaveGarage-linux.tar.gz --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  checksums:
    needs: [windows, macos, linux]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir assets && cd assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'SaveGarage-*'
          sha256sum SaveGarage-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
