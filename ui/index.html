<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#15111d">
  <meta name="referrer" content="no-referrer">
  <title>Save Garage</title>
  <link rel="icon" href="art/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script defer src="i18n.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="masthead">
    <img class="scene" src="art/leonida.svg" alt="" aria-hidden="true">
    <div class="masthead-row">
      <a class="brand" href="./" aria-label="Save Garage home">
        <img src="art/icon.svg" alt="" width="40" height="40">
        <span><span class="brand-name">Save Garage</span><span class="brand-sub">Story saves for GTA VI on PS5</span></span>
      </a>
      <div class="masthead-side">
        <div class="status" id="status" aria-live="polite"></div>
        <label class="lang" data-no-i18n><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg><select id="lang" aria-label="Language"></select></label>
      </div>
    </div>
    <nav class="steps-nav" id="route" aria-label="Steps"></nav>
  </header>
  <main id="main" tabindex="-1"></main>
  <div class="pending" id="pending" hidden></div>
  <div class="passed" id="passed" hidden role="status" aria-live="assertive"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <footer class="foot">
    <span>Runs on your own computer. Your PS5 talks to it over your home network.<br><span class="legal"><span data-no-i18n>Save Garage © 2026 NotHGM.</span> Free software under the GNU GPL v3, with no warranty. <a href="https://github.com/NotHGM/save-garage" target="_blank" rel="noopener">Source and official releases</a></span></span>
    <span class="foot-actions"><span id="version"></span><button class="link" id="quit" type="button" hidden>Quit Save Garage</button></span>
    <div class="update" id="update" role="group" aria-label="Updates" hidden><span class="upd-status" id="update-status" role="status"></span><span class="upd-actions" id="update-actions"></span></div>
  </footer>
  <noscript>Save Garage needs JavaScript.</noscript>
</body>
</html>
